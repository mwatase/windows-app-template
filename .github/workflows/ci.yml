###############################################################################
# The gate every push to main and every pull request has to pass.
#
# It runs on Windows because that is where the programs ship: type checking,
# lint, both test suites, a check that the committed TypeScript bindings still
# match the Rust commands, and a full build. The unsigned installer is
# attached to the run, so a change can be tried on a real Windows PC without
# setting up a build there.
#
# NO SECRETS are used, so it behaves the same for a fork, a pull request and a
# fresh clone. Releasing is release.yml's job.
###############################################################################

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first; only the newest result
# matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify and build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Tauri's dependency tree takes minutes to compile from nothing.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # `npm ci` installs exactly the lockfile, and fails if package.json and
      # the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      - name: Versions agree
        run: npm run version:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Interface tests
        run: npm test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # `cargo test` rewrote src/**/bindings.ts from the Rust signatures. A
      # difference means a command changed without its bindings being
      # regenerated, and the interface would call it with the wrong shape.
      - name: Bindings match the Rust commands
        run: git diff --exit-code -- src/chassis/bindings.ts src/app/bindings.ts

      - name: Build the installer
        run: npm run build -- --bundles nsis --ci

      - name: Attach the installer to the run
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
