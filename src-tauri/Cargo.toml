[package]
name = "windows-app-template"
version = "0.1.0"
description = "Foundation for building native Windows desktop programs"
authors = ["mwatase"]
edition = "2021"
publish = false

[lib]
# The library name is fixed on purpose. `npm run init` renames the package,
# and a lib name that followed it would mean rewriting src/main.rs too. It has
# to differ from the binary's name: the two colliding breaks Windows builds
# (rust-lang/cargo#8519).
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "specta"] }

# The capabilities every program gets. Registering a plugin grants nothing by
# itself: each one is inert until capabilities/ allows specific commands.
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-global-shortcut = "2.3"
# Held at 2.6: the Tauri CLI refuses to build when a plugin's crate and npm
# package disagree on major.minor, and npm has no 2.7 release yet.
tauri-plugin-http = "~2.6"
tauri-plugin-log = "2.9"
tauri-plugin-notification = "2.4"
tauri-plugin-process = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-store = "2.4"
tauri-plugin-updater = "2.12"
tauri-plugin-window-state = "2.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
os_info = { version = "3", default-features = false }

# Typed TypeScript bindings for every command. These are release candidates
# that must move in lockstep, so they are pinned exactly: a loose `^` would
# let `cargo update` pair versions that do not compile together.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# See https://tauri.app/concept/size/ for what each of these trades.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
